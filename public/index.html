<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Controle de Estoque</h1>
    <p id="mensagem" class="mensagem" hidden></p>

    <form id="form-produto">
      <input type="hidden" id="produto-id">
      <label>Nome
        <input id="nome" required>
      </label>
      <label>Categoria
        <input id="categoria">
      </label>
      <label>Preço (R$)
        <input id="preco" type="number" step="0.01" min="0" required>
      </label>
      <label>Quantidade
        <input id="quantidade" type="number" step="1" min="0" value="0" required>
      </label>
      <div class="botoes">
        <button type="submit" id="btn-salvar">Cadastrar</button>
        <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edição</button>
      </div>
    </form>

    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Qtd</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
    <p id="vazio" hidden>Nenhum produto cadastrado.</p>
  </main>
  <dialog id="dialogo">
    <p id="dialogo-texto"></p>
    <input id="dialogo-valor" type="number" min="1" step="1">
    <div class="botoes">
        <button type="button" id="dialogo-ok">Confirmar</button>
        <button type="button" id="dialogo-cancelar" class="secundario">Cancelar</button>
    </div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
